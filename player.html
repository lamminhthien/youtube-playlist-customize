<!doctype html>
<html lang="en">
  <head>

          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-KKHNTRCZ");

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Playing…</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      #player-wrap {
        position: fixed;
        inset: 0;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #pip-button {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 100;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        cursor: pointer;
        font-family: sans-serif;
        font-size: 11px;
        opacity: 0;
        transition: opacity 0.3s;
        user-select: none;
      }
      body:hover #pip-button {
        opacity: 0.7;
      }
      #pip-button:hover {
        opacity: 1 !important;
        background: rgba(0, 0, 0, 0.8);
      }
      #download-button {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 100;
        padding: 6px 12px;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        cursor: pointer;
        font-family: sans-serif;
        font-size: 11px;
        opacity: 0;
        transition: opacity 0.3s;
        user-select: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      body:hover #download-button { opacity: 0.7; }
      #download-button:hover { opacity: 1 !important; background: rgba(0, 0, 0, 0.8); }
      #download-button svg { width: 12px; height: 12px; }
    </style>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KKHNTRCZ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <button id="pip-button">PiP</button>
    <button id="download-button" title="Download this video for offline watching">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download
    </button>
    <div id="player-wrap"><div id="player-target"></div></div>
    <script>
      const QUEUE_STORAGE_KEY = "yt-player-queue";
      const WATCHED_STORAGE_KEY = "yt-watched-videos";
      const params = new URLSearchParams(window.location.search);

      const markVideoWatched = (entry) => {
        if (!entry?.id) return;
        try {
          const raw = localStorage.getItem(WATCHED_STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          const watched = (Array.isArray(parsed) ? parsed : []).filter((it) => it.id !== entry.id);
          watched.push({
            id: entry.id,
            title: entry.title || "",
            url: `https://www.youtube.com/watch?v=${entry.id}`,
            thumbnail: `https://i.ytimg.com/vi/${entry.id}/hqdefault.jpg`,
            watchedAt: Date.now(),
          });
          localStorage.setItem(WATCHED_STORAGE_KEY, JSON.stringify(watched.slice(-50)));
        } catch {
          // localStorage unavailable (e.g. private mode quota) — skip persisting.
        }
      };

      // Prefer the full queue stashed in localStorage by the app (so we can
      // auto-advance), falling back to a single video if it's missing.
      let queue = [];
      try {
        const stored = JSON.parse(localStorage.getItem(QUEUE_STORAGE_KEY) || "null");
        if (stored && Array.isArray(stored.items) && stored.items.length) {
          queue = stored.items;
        }
      } catch {
        queue = [];
      }
      if (!queue.length) {
        const v = params.get("v");
        if (v) queue = [{ id: v, title: params.get("title") || "" }];
      }

      const startIndex = Number(params.get("i"));
      let currentIndex = Number.isInteger(startIndex) && queue[startIndex] ? startIndex : 0;
      let player;

      const setTitleFor = (index) => {
        document.title = queue[index]?.title || "YouTube video player";
      };

      const playNext = () => {
        if (currentIndex >= queue.length - 1) return;
        currentIndex += 1;
        const entry = queue[currentIndex];
        setTitleFor(currentIndex);
        markVideoWatched(entry);
        player?.loadVideoById(entry.id);
      };

      window.onYouTubeIframeAPIReady = () => {
        const entry = queue[currentIndex];
        if (!entry) {
          document.getElementById("player-wrap").textContent = "No video specified.";
          return;
        }
        setTitleFor(currentIndex);
        markVideoWatched(entry);
        player = new YT.Player("player-target", {
          host: "https://www.youtube-nocookie.com",
          videoId: entry.id,
          playerVars: { autoplay: 1, rel: 0, modestbranding: 1, playsinline: 1 },
          events: {
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.ENDED) playNext();
            },
          },
        });
      };

      const togglePiP = async () => {
        if (!window.documentPictureInPicture) {
          return;
        }
        try {
          const entry = queue[currentIndex];
          if (!entry) return;

          const pipWindow = await window.documentPictureInPicture.requestWindow({
            width: 640,
            height: 360,
          });

          player?.pauseVideo();

          const styleTag = document.querySelector("style");
          if (styleTag) {
            const newStyle = document.createElement("style");
            newStyle.textContent = styleTag.textContent;
            pipWindow.document.head.append(newStyle);
          }

          const iframe = document.createElement("iframe");
          const origin = window.location.origin;
          // Removed autoplay=1 to see if it bypasses the configuration error
          iframe.src = `https://www.youtube-nocookie.com/embed/${entry.id}?rel=0&modestbranding=1&playsinline=1&origin=${origin}`;
          iframe.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;";
          iframe.allow = "autoplay; encrypted-media; picture-in-picture";
          iframe.referrerPolicy = "strict-origin-when-cross-origin";

          pipWindow.document.body.append(iframe);

          const playerWrap = document.getElementById("player-wrap");
          playerWrap.style.display = "none";

          pipWindow.onclose = () => {
            playerWrap.style.display = "block";
            player?.playVideo();
          };
        } catch (err) {
          console.error("PiP failed:", err);
        }
      };

      const pipBtn = document.getElementById("pip-button");
      if (!window.documentPictureInPicture) {
        pipBtn.style.display = "none";
      } else {
        pipBtn.addEventListener("click", togglePiP);
      }

      // Download current video for offline watching
      const downloadBtn = document.getElementById("download-button");
      const triggerDownload = () => {
        const entry = queue[currentIndex];
        if (!entry?.id) return;
        const title = entry.title || entry.id;
        // Use same-origin streaming endpoint; Content-Disposition forces download
        const url = `/api/download?id=${encodeURIComponent(entry.id)}&download=1`;
        const a = document.createElement("a");
        a.href = url;
        a.download = `${title.slice(0, 80)}.mp4`;
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        setTimeout(() => a.remove(), 1000);
      };
      downloadBtn.addEventListener("click", triggerDownload);
      // Hide download if no video
      if (!queue.length && !params.get("v")) downloadBtn.style.display = "none";

      const tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      document.body.appendChild(tag);
    </script>
  </body>
</html>
