<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#cc0000" />
    <meta name="description" content="All your curated YouTube playlists in one calm, distraction-free place." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Playlist Hub" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <title>Playlist Hub · LMT</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./index.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((err) =>
            console.warn("SW registration failed:", err)
          );
        });
      }
    </script>
  </head>
  <body>
    <div class="yt-page">
      <header class="yt-header">
        <div class="yt-logo-row">
          <img src="./logo.svg" alt="Playlist Hub logo" width="40" height="40" />
          <div>
            <div class="yt-wordmark"><span class="yt-wordmark-accent">Play</span>listHub</div>
            <p class="yt-tagline">All your curated playlists in one place.</p>
          </div>
        </div>

        <button
          id="clear-cache-btn"
          title="Clear cached files and reload"
          onclick="(async () => {
            const btn = document.getElementById('clear-cache-btn');
            btn.disabled = true;
            btn.setAttribute('aria-busy', 'true');
            const icon = btn.querySelector('.yt-btn-icon');
            icon.classList.add('spinning');
            try {
              if ('serviceWorker' in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map(r => r.unregister()));
              }
              if ('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
              }
              window.location.reload(true);
            } catch (e) {
              console.error('Cache clear failed:', e);
              btn.disabled = false;
              btn.removeAttribute('aria-busy');
              icon.classList.remove('spinning');
            }
          })()"
          class="yt-btn"
        >
          <svg
            class="yt-btn-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
          Clear Cache
        </button>
      </header>

      <main id="app-container" class="yt-main" aria-live="polite"></main>
    </div>
  </body>
</html>
