<!doctype html>
<html lang="en">
  <head>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-KKHNTRCZ");
    </script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfcff" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="All your curated YouTube playlists in one calm, distraction-free place — now with iPadOS liquid glass design." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Playlist Hub" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <title>Playlist Hub · LMT</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      // Early coarse-pointer / Android hook so CSS can disable expensive glass
      // before first paint. Covers Tab A9+ (pointer:coarse) and Chrome variants
      // where pointer media query is flaky.
      (function () {
        try {
          var isCoarse = false;
          if (window.matchMedia) {
            isCoarse = window.matchMedia("(pointer: coarse)").matches || window.matchMedia("(hover: none)").matches;
          }
          var ua = navigator.userAgent || "";
          var isAndroid = /Android/i.test(ua);
          // Also treat low-memory / low-core devices as coarse to preserve battery/GPU
          var lowMem = navigator.deviceMemory && navigator.deviceMemory <= 4;
          var lowCpu = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4;
          if (isCoarse || isAndroid || lowMem || lowCpu) {
            document.documentElement.classList.add("is-coarse");
          }
          // Allow manual opt-out via ?glass=1
          if (new URLSearchParams(location.search).has("glass")) {
            document.documentElement.classList.remove("is-coarse");
          }
        } catch {}
      })();
    </script>
    <script type="module" src="./index.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((err) =>
            console.warn("SW registration failed:", err)
          );
        });
      }
    </script>
  </head>
  <body>
    <!-- Liquid Glass Background -->
    <div class="liquid-bg" aria-hidden="true">
      <div class="liquid-orb liquid-orb--1"></div>
      <div class="liquid-orb liquid-orb--2"></div>
      <div class="liquid-orb liquid-orb--3"></div>
      <div class="liquid-orb liquid-orb--4"></div>
    </div>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KKHNTRCZ" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div class="yt-page">
      <header class="yt-header">
        <div class="yt-header-glow" aria-hidden="true"></div>
        <div class="yt-logo-row" id="yt-logo-row">
          <div class="yt-logo-wrap">
            <img src="./logo.svg" alt="Playlist Hub logo" width="40" height="40" />
          </div>
          <div>
            <div class="yt-wordmark"><span class="yt-wordmark-accent">Play</span>listHub</div>
            <p class="yt-tagline">All your curated playlists — <span class="yt-tagline-strong">cinematic, calm, yours.</span></p>
          </div>
        </div>

        <div class="yt-header-actions">
          <!-- Feedback button injected here by index.js -->
          <button
            id="clear-cache-btn"
            title="Clear cached files and reload"
            onclick="(async () => {
              const btn = document.getElementById('clear-cache-btn');
              btn.disabled = true;
              btn.setAttribute('aria-busy', 'true');
              const icon = btn.querySelector('.yt-btn-icon');
              icon.classList.add('spinning');
              try {
                if ('serviceWorker' in navigator) {
                  const regs = await navigator.serviceWorker.getRegistrations();
                  await Promise.all(regs.map(r => r.unregister()));
                }
                if ('caches' in window) {
                  const keys = await caches.keys();
                  await Promise.all(keys.map(k => caches.delete(k)));
                }
                window.location.reload(true);
              } catch (e) {
                console.error('Cache clear failed:', e);
                btn.disabled = false;
                btn.removeAttribute('aria-busy');
                icon.classList.remove('spinning');
              }
            })()"
            class="yt-btn yt-btn-ghost"
          >
            <svg
              class="yt-btn-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
            Clear Cache
          </button>
        </div>
      </header>

      <main id="app-container" class="yt-main" aria-live="polite"></main>
    </div>

    <button
      id="scroll-to-top"
      class="yt-scroll-top"
      type="button"
      aria-label="Scroll to top"
      title="Scroll to top"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 15l-6-6-6 6" />
      </svg>
    </button>
  </body>
</html>
